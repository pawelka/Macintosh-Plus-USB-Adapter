[env:ch554]
platform = intel_mcs51
board = ch554
build_flags = -DFREQ_SYS=16000000 -DMAX_PACKET_SIZE=64
              -DDEBUG_SERIAL=0 -DUART0_BAUD=9600

# DEBUG_SERIAL=1 enables debug logs on UART0 TX P3.1, 9600 8N1

upload_protocol = custom
#upload_protocol = ch55x

# ch55xtool.py requires PyUSB and the bundled libusb backend. Install project
# Python deps into PlatformIO's Python environment with:
#   $PYTHONEXE -m pip install -r requirements-pio.txt
upload_command = sdobjcopy -I ihex -O binary $SOURCE firmware.bin ;
                 $PYTHONEXE ch55xtool.py -f firmware.bin

#upload_command = objcopy -I ihex -O binary $SOURCE /tmp/firmware.bin ;
#                 ./wchisptool -f /tmp/firmware.bin
